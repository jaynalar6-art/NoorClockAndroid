name: Build NoorClockAndroid APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip project files
        run: unzip NoorClockAndroid_lengkap.zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Project, Give Permission and Build
        run: |
          # Mencari folder proyek utama yang berisi berkas gradlew
          PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Folder proyek utama ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Memberikan izin akses eksekusi ke gradlew bawaan proyek
          chmod +x gradlew
          
          # Merakit APK menggunakan versi Gradle asli proyek Anda
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorClockAndroid-APK
          path: "**/build/outputs/apk/debug/*.apk"
