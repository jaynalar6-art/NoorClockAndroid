name: Build NoorClockAndroid APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip project files
        run: unzip NoorClockAndroid_lengkap.zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Required Gradle Version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Project and Build with Local Gradle
        run: |
          # Mencari folder proyek yang berisi file build.gradle
          PROJECT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          echo "Folder proyek ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Melakukan kompilasi menggunakan Gradle versi 8.9 yang diminta proyek
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorClockAndroid-APK
          path: "**/build/outputs/apk/debug/*.apk"
